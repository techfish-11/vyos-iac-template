[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "src/.cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"plugins/action/*.py" = ["E402"]
"plugins/filter/*.py" = ["E402"]
